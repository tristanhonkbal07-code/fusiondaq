

<!DOCTYPE html>

<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fusion DAW</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#090b12;color:#f4f6ff;font-family:Arial,sans-serif;padding:16px}

h1{color:#36e5ff;margin-bottom:4px}

p{color:#9ca8c4}

.card{background:#151b2b;border:1px solid #303950;border-radius:14px;padding:14px;margin:12px 0}

button{background:#252e43;color:white;border:1px solid #45516c;padding:11px;border-radius:9px;margin:3px;font-weight:bold}

button.active,.on{background:#36e5ff!important;color:#071018!important}

input,select{background:#0c1120;color:white;border:1px solid #45516c;padding:8px;border-radius:7px}

input[type=range]{width:100%;accent-color:#36e5ff}

.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}

.step{aspect-ratio:1;padding:0;background:#293249;border-radius:5px}

.track{display:grid;grid-template-columns:65px 1fr;gap:8px;align-items:center;margin:12px 0}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

.hidden{display:none}

</style>

</head>

<body>

<h1>FUSION DAW</h1>

<p>Your mobile music studio</p>

<div class="card">

<button onclick="play()" id="play">▶ PLAY</button>

<button onclick="stop()">■ STOP</button>

<button onclick="save()">💾 SAVE</button>

<p>Tempo: <b id="tempoText">120</b> BPM</p>

<input id="tempo" type="range" min="60" max="180" value="120" oninput="tempoText.textContent=this.value">

<p>Master volume</p>

<input id="master" type="range" min="0" max="100" value="70">

</div>

<div class="card">

<div class="tabs">

<button onclick="page('drums')">🥁 Drums</button>

<button onclick="page('piano')">🎹 Piano</button>

<button onclick="page('studio')">🎚 Studio</button>

</div>

</div>

<section id="drums" class="card">

<h3>DRUM MACHINE</h3>

<div id="drumArea"></div>

<button onclick="preset()">HIPHOP BEAT</button>

<button onclick="clearDrums()">CLEAR</button>

</section>

<section id="piano" class="card hidden">

<h3>PIANO ROLL</h3>

<p>Druk op de vakjes om noten te plaatsen.</p>

<div id="pianoArea"></div>

<button onclick="clearNotes()">CLEAR NOTES</button>

</section>

<section id="studio" class="card hidden">

<h3>STUDIO</h3>

<p>Projectnaam</p>

<input id="projectName" value="My First Beat">

<p>Importeer een audiobestand</p>

<input type="file" id="audioFile" accept="audio/*">

<div id="audioArea"></div>

<p>Reverb</p><input type="range" min="0" max="100" value="15">

<p>Delay</p><input type="range" min="0" max="100" value="10">

<p id="status">Studio ready.</p>

<button onclick="save()">SAVE PROJECT</button>

<button onclick="exportProject()">EXPORT PROJECT</button>

</section>

<script>

const names=['KICK','SNARE','CLAP','HI-HAT'];

let beats=names.map(()=>Array(16).fill(false));

let melody=Array.from({length:8},()=>Array(16).fill(false));

let ctx=null,masterGain=null,playing=false,step=0,clock=null;

let audio=new Audio();

function init(){

 if(!ctx){

  ctx=new (window.AudioContext||window.webkitAudioContext)();

  masterGain=ctx.createGain();

  masterGain.connect(ctx.destination);

 }

 if(ctx.state==='suspended')ctx.resume();

 masterGain.gain.value=Number(document.getElementById('master').value)/100;

}

function tone(freq,dur,type='sine',vol=.3){

 init();

 let o=ctx.createOscillator(),g=ctx.createGain();

 o.type=type;o.frequency.value=freq;

 g.gain.setValueAtTime(vol,ctx.currentTime);

 g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);

 o.connect(g);g.connect(masterGain);o.start();o.stop(ctx.currentTime+dur);

}

function drum(i){

 init();

 if(i===0){tone(100,.18,'sine',.9);setTimeout(()=>tone(55,.12,'sine',.6),30)}

 if(i===1){tone(180,.12,'triangle',.5);noise(.15,.3)}

 if(i===2){noise(.10,.25)}

 if(i===3){noise(.045,.16)}

}

function noise(dur,vol){

 init();

 let n=Math.floor(ctx.sampleRate*dur);

 let b=ctx.createBuffer(1,n,ctx.sampleRate),data=b.getChannelData(0);

 for(let i=0;i<n;i++)data[i]=Math.random()*2-1;

 let s=ctx.createBufferSource(),g=ctx.createGain();

 s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(masterGain);s.start();

}

function buildDrums(){

 let area=document.getElementById('drumArea');area.innerHTML='';

 names.forEach((name,r)=>{

  let row=document.createElement('div');row.className='track';

  row.innerHTML='<b style="font-size:11px">'+name+'</b>';

  let grid=document.createElement('div');grid.className='grid';

  for(let c=0;c<16;c++){

   let b=document.createElement('button');b.className='step';

   b.textContent=(c%4===0)?'●':'';

   b.onclick=()=>{beats[r][c]=!beats[r][c];b.classList.toggle('on',beats[r][c])};

   grid.appendChild(b);

  }

  row.appendChild(grid);area.appendChild(row);

 });

}

function buildPiano(){

 let area=document.getElementById('pianoArea');area.innerHTML='';

 const ns=['C5','B4','A4','G4','F4','E4','D4','C4'];

 ns.forEach((name,r)=>{

  let row=document.createElement('div');row.className='track';

  row.innerHTML='<b style="font-size:11px">'+name+'</b>';

  let grid=document.createElement('div');grid.className='grid';

  for(let c=0;c<16;c++){

   let b=document.createElement('button');b.className='step';

   b.onclick=()=>{melody[r][c]=!melody[r][c];b.classList.toggle('on',melody[r][c])};

   grid.appendChild(b);

  }

  row.appendChild(grid);area.appendChild(row);

 });

}

function play(){

 if(playing){stop();return}

 init();playing=true;document.getElementById('play').classList.add('active');

 let ms=60000/Number(document.getElementById('tempo').value)/4;

 clock=setInterval(()=>{

  for(let r=0;r<beats.length;r++)if(beats[r][step])drum(r);

  const f=[523,494,440,392,349,330,294,262];

  for(let r=0;r<melody.length;r++)if(melody[r][step])tone(f[r],.22,'triangle',.3);

  step=(step+1)%16;

 },ms);

}

function stop(){

 playing=false;clearInterval(clock);step=0;

 document.getElementById('play').classList.remove('active');

}

function preset(){

 beats.forEach(a=>a.fill(false));

 [0,8].forEach(c=>beats[0][c]=true);

 [4,12].forEach(c=>beats[1][c]=true);

 for(let c=0;c<16;c+=2)beats[3][c]=true;

 refresh();

}

function refresh(){

 document.querySelectorAll('#drumArea .track').forEach((row,r)=>{

  row.querySelectorAll('button').forEach((b,c)=>b.classList.toggle('on',beats[r][c]));

 });

 document.querySelectorAll('#pianoArea .track').forEach((row,r)=>{

  row.querySelectorAll('button').forEach((b,c)=>b.classList.toggle('on',melody[r][c]));

 });

}

function clearDrums(){beats.forEach(a=>a.fill(false));refresh()}

function clearNotes(){melody.forEach(a=>a.fill(false));refresh()}

function page(id){

 document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));

 document.getElementById(id).classList.remove('hidden');

}

function save(){

 localStorage.setItem('fusionProject',JSON.stringify({

  name:document.getElementById('projectName').value,

  beats,melody,tempo:document.getElementById('tempo').value

 }));

 document.getElementById('status').textContent='Project saved on this device!';

}

function exportProject(){

 let data=localStorage.getItem('fusionProject');

 if(!data){save();data=localStorage.getItem('fusionProject')}

 let blob=new Blob([data],{type:'application/json'});

 let url=URL.createObjectURL(blob),a=document.createElement('a');

 a.href=url;a.download='fusion-project.json';a.click();

 URL.revokeObjectURL(url);

}

document.getElementById('audioFile').addEventListener('change',e=>{

 let f=e.target.files[0];if(!f)return;

 audio.src=URL.createObjectURL(f);audio.controls=true;audio.loop=true;

 document.getElementById('audioArea').innerHTML='';

 document.getElementById('audioArea').appendChild(audio);

});

buildDrums();buildPiano();preset();

</script>

</body>

</html>
